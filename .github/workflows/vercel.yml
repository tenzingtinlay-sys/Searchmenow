name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.token.outputs.has }}
    steps:
      - id: token
        run: echo "has=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax check
        run: for f in server/*.js api/*.js public/js/*.js; do node --check "$f"; done
      - name: Smoke test
        run: |
          DATA_DIR=$(mktemp -d) PORT=3000 node server/index.js & sleep 2
          curl -fsS localhost:3000/api/health
          curl -fsS localhost:3000/api/google/status | grep -q '"configured":false'
          test "$(curl -s -o /tmp/google.json -w '%{http_code}' 'http://localhost:3000/api/public/google/youtube?q=smoke-test')" = "503"
          curl -fsS localhost:3000/ | grep -q Searchmenow && curl -fsS -o /dev/null localhost:3000/js/app.js


  google-api-smoke:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Check secret availability
        id: google_secret
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -n "$GOOGLE_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_API_KEY secret is configured."
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_API_KEY secret is missing; live Google API tests will be skipped."
          fi
      - name: Test YouTube Data API v3
        if: steps.google_secret.outputs.has_key == 'true'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          set +x
          code=$(curl --silent --output /tmp/youtube-response.json --write-out '%{http_code}' --get 'https://www.googleapis.com/youtube/v3/search' --data-urlencode 'part=snippet' --data-urlencode 'type=video' --data-urlencode 'q=Searchmenow smoke test' --data-urlencode 'maxResults=1' --data-urlencode "key=$GOOGLE_API_KEY" || true)
          if [ "$code" != "200" ] || ! node -e "const x=require('/tmp/youtube-response.json');process.exit(Array.isArray(x.items)?0:1)" 2>/dev/null; then
            echo "YouTube API test failed (HTTP ${code:-unknown}). Check API enablement, key restrictions, quota and billing."
            exit 1
          fi
          echo "YouTube Data API v3 authenticated request passed."
      - name: Test Places API (New)
        if: steps.google_secret.outputs.has_key == 'true'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          set +x
          code=$(curl --silent --output /tmp/places-response.json --write-out '%{http_code}' --request POST 'https://places.googleapis.com/v1/places:searchText' --header "X-Goog-Api-Key: $GOOGLE_API_KEY" --header 'X-Goog-FieldMask: places.id,places.displayName,places.formattedAddress' --header 'Content-Type: application/json' --data '{"textQuery":"coffee in London"}' || true)
          if [ "$code" != "200" ] || ! node -e "const x=require('/tmp/places-response.json');process.exit(Array.isArray(x.places)?0:1)" 2>/dev/null; then
            echo "Places API test failed (HTTP ${code:-unknown}). Check Places API enablement, key restrictions, quota and billing."
            exit 1
          fi
          echo "Places API (New) authenticated request passed."
      - name: Report skipped API tests
        if: steps.google_secret.outputs.has_key != 'true'
        run: echo "Google API smoke tests skipped because GOOGLE_API_KEY is not configured as a repository secret."

  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: needs.check.outputs.has_token == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g vercel@latest
      - name: Pull Vercel settings
        run: vercel pull --yes --environment=${{ github.event_name == 'push' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
      - name: Show URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
