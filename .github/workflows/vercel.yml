name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.token.outputs.has }}
    steps:
      - id: token
        run: echo "has=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax check
        run: for f in server/*.js api/*.js public/js/*.js; do node --check "$f"; done
      - name: Smoke test
        run: |
          DATA_DIR=$(mktemp -d) PORT=3000 node server/index.js & sleep 2
          curl -fsS localhost:3000/api/health
          curl -fsS localhost:3000/api/google/status | grep -q '"configured":false'
          test "$(curl -s -o /tmp/google.json -w '%{http_code}' 'http://localhost:3000/api/public/google/youtube?q=smoke-test')" = "503"
          curl -fsS localhost:3000/ | grep -q Searchmenow && curl -fsS -o /dev/null localhost:3000/js/app.js

  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: needs.check.outputs.has_token == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g vercel@latest
      - name: Pull Vercel settings
        run: vercel pull --yes --environment=${{ github.event_name == 'push' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
      - name: Show URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
